name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project and build
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "هیچ فایل zip در ریشه repository پیدا نشد"; exit 1; fi
          echo "Using $Z"
          mkdir -p work
          unzip -oq "$Z" -d work
          S=$(find work -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts داخل zip نیست"; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: BankSms-apk
          path: work/**/app-debug.apk
